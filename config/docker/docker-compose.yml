version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://dev_user:dev_password@db:5432/transcendent_dev
    depends_on:
      - db
    volumes:
      - ../..:/app
      - /app/build

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: transcendent_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: