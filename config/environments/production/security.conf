# Production Security Configuration
security.encryption.enabled=true
security.authentication.required=true
security.cors.enabled=true
security.cors.allowed_origins=https://transcendent.com,https://api.transcendent.com
security.rate_limiting.enabled=true
security.rate_limiting.requests_per_minute=500
security.jwt.secret=${PROD_JWT_SECRET}
security.ssl.enabled=true
security.hsts.enabled=true