# Production Python Logging Configuration
[loggers]
keys=root,transcendent

[handlers]
keys=fileHandler,errorHandler

[formatters]
keys=productionFormatter

[logger_root]
level=WARN
handlers=fileHandler

[logger_transcendent]
level=INFO
handlers=fileHandler,errorHandler
qualname=transcendent
propagate=0

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=productionFormatter
args=('/var/log/transcendent/production.log',)

[handler_errorHandler]
class=FileHandler
level=ERROR
formatter=productionFormatter
args=('/var/log/transcendent/error.log',)

[formatter_productionFormatter]
format=PROD: %(asctime)s - %(name)s - %(levelname)s - %(message)s