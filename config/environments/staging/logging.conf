# Staging Python Logging Configuration
[loggers]
keys=root,transcendent

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=stagingFormatter

[logger_root]
level=INFO
handlers=fileHandler

[logger_transcendent]
level=INFO
handlers=consoleHandler,fileHandler
qualname=transcendent
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=stagingFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=stagingFormatter
args=('/var/log/transcendent/staging.log',)

[formatter_stagingFormatter]
format=STAGING: %(asctime)s - %(name)s - %(levelname)s - %(message)s