name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v2
    
    - name: Cache Bazel
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/bazel
        key: ${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', '**/WORKSPACE') }}
    
    - name: Build with Bazel
      run: bazel build //...
    
    - name: Run unit tests
      run: bazel test //src/test/...
    
    - name: Build artifacts
      run: |
        bazel build //src/main/cpp:transcendent
        mkdir -p artifacts
        cp -L bazel-bin/src/main/cpp/transcendent artifacts/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: transcendent-${{ github.sha }}
        path: artifacts/