[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=testFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=testFormatter
args=(sys.stdout,)

[formatter_testFormatter]
format=TEST: %(asctime)s - %(name)s - %(levelname)s - %(message)s