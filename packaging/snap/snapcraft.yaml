name: transcendent
base: core22
version: '1.0.0'
summary: Comprehensive user and transaction management application
description: |
  Transcendent is a high-performance C++ application designed for managing
  users and transactions with enterprise-grade security and scalability.

  Features:
  - RESTful API for user and transaction management
  - JWT-based authentication and authorization
  - PostgreSQL database integration
  - Comprehensive logging and monitoring
  - Docker and Kubernetes deployment support

grade: stable
confinement: strict

architectures:
  - build-on: amd64
    build-for: amd64

apps:
  transcendent:
    command: bin/transcendent
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - home
    environment:
      TRANSCENDENT_CONFIG: $SNAP_DATA/config/application.conf
      TRANSCENDENT_LOGS: $SNAP_DATA/logs

  transcendent-cli:
    command: bin/transcendent-cli
    plugs:
      - network

parts:
  transcendent:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - cmake
      - libssl-dev
      - libpq-dev
      - openjdk-11-jdk
      - python3
      - python3-pip
      - wget
    stage-packages:
      - libssl3
      - libpq5
    override-build: |
      # Install Bazel
      wget -O /tmp/bazel-installer.sh https://github.com/bazelbuild/bazel/releases/download/6.0.0/bazel-6.0.0-installer-linux-x86_64.sh
      chmod +x /tmp/bazel-installer.sh
      /tmp/bazel-installer.sh --user
      export PATH=$PATH:$HOME/bin
      
      # Build the application
      bazel build //src/main/cpp:transcendent
      
      # Install binary
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp bazel-bin/src/main/cpp/transcendent $SNAPCRAFT_PART_INSTALL/bin/
      
      # Install configuration files
      mkdir -p $SNAPCRAFT_PART_INSTALL/config
      cp -r config/environments/production/* $SNAPCRAFT_PART_INSTALL/config/

hooks:
  configure:
    plugs: [network]
  install:
    plugs: [network]

layout:
  /var/log/transcendent:
    bind: $SNAP_DATA/logs