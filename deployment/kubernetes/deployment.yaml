apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcendent
  namespace: default
  labels:
    app: transcendent
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transcendent
  template:
    metadata:
      labels:
        app: transcendent
        version: v1.0.0
    spec:
      containers:
      - name: transcendent
        image: transcendent:1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: transcendent-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: transcendent-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /var/log/transcendent
      volumes:
      - name: config
        configMap:
          name: transcendent-config
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: transcendent-service
  namespace: default
  labels:
    app: transcendent
spec:
  selector:
    app: transcendent
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transcendent-config
  namespace: default
data:
  application.conf: |
    # Transcendent Application Configuration
    server:
      port: 8080
      host: 0.0.0.0
    
    database:
      host: postgres-service
      port: 5432
      name: transcendent_prod
      pool_size: 10
    
    logging:
      level: INFO
      file: /var/log/transcendent/app.log
    
    security:
      jwt_expiry: 24h
      bcrypt_rounds: 12
---
