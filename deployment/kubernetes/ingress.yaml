apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcendent-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.transcendent.example.com
    secretName: transcendent-tls
  rules:
  - host: api.transcendent.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transcendent-service
            port:
              number: 80