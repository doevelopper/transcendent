apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transcendent.fullname" . }}-config
  labels:
    {{- include "transcendent.labels" . | nindent 4 }}
data:
  application.conf: |
    # Transcendent Application Configuration
    server:
      port: {{ .Values.service.targetPort }}
      host: 0.0.0.0
    
    database:
      host: {{ .Values.database.host | default (printf "%s-postgresql" (include "transcendent.fullname" .)) }}
      port: {{ .Values.database.port }}
      name: {{ .Values.database.name }}
      pool_size: 10
    
    logging:
      level: {{ .Values.config.logLevel }}
      file: /var/log/transcendent/app.log
    
    security:
      jwt_expiry: 24h
      bcrypt_rounds: 12