---
- name: Deploy Transcendent Application
  hosts: production
  become: yes
  gather_facts: yes
  
  vars:
    app_name: transcendent
    app_version: "{{ version | default('1.0.0') }}"
    app_user: transcendent
    app_port: 8080
    
  roles:
    - common
    - application
    - database
    
  tasks:
    - name: Ensure application is running
      systemd:
        name: "{{ app_name }}"
        state: started
        enabled: yes
      
    - name: Wait for application to be ready
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10
      
  post_tasks:
    - name: Verify deployment
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
      register: health_check
      
    - name: Display deployment status
      debug:
        msg: "Deployment successful! Application is running on port {{ app_port }}"
      when: health_check.status == 200